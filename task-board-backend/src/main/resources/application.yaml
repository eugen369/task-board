server:
  address: 127.0.0.1

spring:
  application:
    name: task-board-backen
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/taskboard}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true