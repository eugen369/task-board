<div class="board-list">
    <h1>Task Board</h1>

    <form (ngSubmit)="createBoard()" class="create-form">
        <input [(ngModel)]="newBoardName" name="boardName" placeholder="Neues Board..." required />
        <button type="submit" [disabled]="!newBoardName.trim()">
            Erstellen
        </button>
    </form>

    @if (error()) {
    <p class="error">{{ error() }}</p>
    }

    @if (boards().length === 0) {
    <p class="empty">Noch keine Boards vorhanden.</p>
    } @else {
    <ul>
        @for (board of boards(); track board.id) {
        <li>
          <a [routerLink]="['/boards', board.id]">{{ board.name }}</a>
          <button class="delete-btn" (click)="deleteBoard(board, $event)">✕</button>
        </li>
        }
    </ul>
    }
</div>
